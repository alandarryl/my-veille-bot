[project]
name = "veille-discord"
version = "0.1.0"
description = "Bot de veille automatique propulsé par LLM (Gemini/Groq) et envoyé sur Discord via GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "google-genai>=0.1.0",
    "groq>=0.4.0",           # Ajouté pour supporter l'API Groq en backup
    "pyyaml>=6.0.1",
    "tenacity>=8.2.3",
    "trafilatura>=1.6.3",
    "python-dotenv>=1.0.1",  # Utile pour charger le .env en local
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- AJOUTER CETTE SECTION ---
[tool.hatch.build.targets.wheel]
packages = ["src/veille"]

[tool.ruff]
line-length = 88
target-version = "py310"